[package]
name = "titanes_de_la_oscuridad"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "titanes_de_la_oscuridad"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
